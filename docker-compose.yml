services:
  data-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m data.generator --output-dir /workspace/data/processed
    volumes:
      - duckdb_data:/workspace/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DUCKDB_PATH: ${DUCKDB_PATH:-/workspace/data/processed/datasherlock.duckdb}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-datasherlock}
      POSTGRES_USER: ${POSTGRES_USER:-datasherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      INCIDENT_CHECKPOINT_BACKEND: ${INCIDENT_CHECKPOINT_BACKEND:-postgres}
      INCIDENT_AUDIT_RETENTION_DAYS: ${INCIDENT_AUDIT_RETENTION_DAYS:-365}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - duckdb_data:/workspace/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasherlock}
      POSTGRES_USER: ${POSTGRES_USER:-datasherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-datasherlock}
      PGUSER: ${POSTGRES_USER:-datasherlock}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          timestamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --format=custom --file=/backups/datasherlock-$$timestamp.dump
          find /backups -type f -name '*.dump' -mtime +$$BACKUP_RETENTION_DAYS -delete
          sleep $$BACKUP_INTERVAL_SECONDS
        done
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  audit-retention:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-datasherlock}
      PGUSER: ${POSTGRES_USER:-datasherlock}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      INCIDENT_AUDIT_RETENTION_DAYS: ${INCIDENT_AUDIT_RETENTION_DAYS:-365}
      AUDIT_RETENTION_INTERVAL_SECONDS: ${AUDIT_RETENTION_INTERVAL_SECONDS:-86400}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          psql --set=ON_ERROR_STOP=1 --command \
            "DELETE FROM incident_audit_events WHERE occurred_at < NOW() - make_interval(days => $$INCIDENT_AUDIT_RETENTION_DAYS::integer)"
          sleep $$AUDIT_RETENTION_INTERVAL_SECONDS
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  duckdb_data:
  postgres_data:
  postgres_backups:
