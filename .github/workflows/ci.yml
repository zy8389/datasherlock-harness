name: CI

on:
  push:
    branches: [main, chore/project-structure]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Initialize data volume
        run: docker compose run --rm data-init

      - name: Start services
        run: docker compose up -d

      - name: Wait for API and frontend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            api_status="$(curl -sS -o /tmp/api-health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)"
            frontend_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/_stcore/health || true)"
            if [[ "$api_status" == "200" && "$frontend_status" == "200" ]]; then
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres frontend
          exit 1

      - name: Tear down services
        if: always()
        run: docker compose down -v
