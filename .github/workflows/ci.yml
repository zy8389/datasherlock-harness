name: CI

on:
  push:
    branches: [main, chore/project-structure]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Initialize data volume
        run: docker compose run --rm data-init

      - name: Start services
        run: docker compose up -d

      - name: Wait for API and frontend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            api_status="$(curl -sS -o /tmp/api-health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)"
            frontend_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/_stcore/health || true)"
            if [[ "$api_status" == "200" && "$frontend_status" == "200" ]]; then
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres frontend
          exit 1

      - name: Run F01 demo API E2E
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/demo/cases > /tmp/demo-cases.json
          python3 - <<'PY'
          import json
          with open("/tmp/demo-cases.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert len(payload["cases"]) == 60
          assert next(item for item in payload["cases"] if item["case_id"] == "F01-001")["interactive_supported"]
          PY
          curl -fsS -X POST http://127.0.0.1:8000/demo/incidents \
            -H 'Content-Type: application/json' \
            -d '{"case_id":"F01-001"}' > /tmp/demo-start.json
          incident_id="$(python3 -c 'import json; print(json.load(open("/tmp/demo-start.json"))["incident_id"])')"
          python3 - <<'PY'
          import json
          with open("/tmp/demo-start.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["status"] == "AWAITING_APPROVAL"
          assert payload["root_cause"]["root_cause_type"] == "missing_partition"
          assert payload["approval"] is None
          assert payload["repair"] is None
          assert payload["post_validation"] is None
          assert payload["model_calls"] == 0
          PY
          curl -fsS "http://127.0.0.1:8000/demo/incidents/${incident_id}" > /tmp/demo-get.json
          curl -fsS -X POST "http://127.0.0.1:8000/demo/incidents/${incident_id}/approval" \
            -H 'Content-Type: application/json' \
            -d '{"reviewer":"ci-reviewer","outcome":"approved","comment":"CI sandbox approval."}' \
            > /tmp/demo-resolved.json
          python3 - <<'PY'
          import json
          with open("/tmp/demo-resolved.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["status"] == "RESOLVED"
          assert payload["repair"]["handler_invocation_count"] == 1
          assert payload["post_validation"]["status"] == "passed"
          assert payload["final_report"]["final_status"] == "RESOLVED"
          PY

      - name: Tear down services
        if: always()
        run: docker compose down -v
