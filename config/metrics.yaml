version: 1
timezone: UTC
date_grain: day

metrics:
  - id: daily_active_users
    name: Daily Active Users
    description: Distinct users with at least one event on the metric date.
    source_table: events
    time_column: event_time
    entity_column: user_id
    aggregation: count_distinct
    formula: COUNT(DISTINCT user_id)
    query: >-
      SELECT CAST(event_time AS DATE) AS metric_date,
      COUNT(DISTINCT user_id) AS daily_active_users
      FROM events
      GROUP BY metric_date
    unit: users
    validation:
      expected_column_types:
        metric_date: DATE
        daily_active_users: BIGINT
      numeric_ranges:
        daily_active_users:
          minimum: 0
      max_result_rows: 1000
    common_anomalies:
      - sudden daily active-user decrease
      - device or region segment disappearance
      - target-day drop followed by a rebound
    verification_fields:
      - events.event_time
      - events.user_id
      - events.device_type
      - users.region
    diagnostic_tools:
      - sql_query
      - check_null_rate
      - check_freshness
      - detect_distribution_drift

  - id: new_users
    name: New Users
    description: Distinct users whose registration date is the metric date.
    source_table: users
    time_column: register_time
    entity_column: user_id
    aggregation: count_distinct
    formula: COUNT(DISTINCT user_id)
    query: >-
      SELECT CAST(register_time AS DATE) AS metric_date,
      COUNT(DISTINCT user_id) AS new_users
      FROM users
      GROUP BY metric_date
    unit: users
    validation:
      expected_column_types:
        metric_date: DATE
        new_users: BIGINT
      numeric_ranges:
        new_users:
          minimum: 0
      max_result_rows: 1000
    common_anomalies:
      - registrations unexpectedly reach zero
      - registration volume spikes or shifts to the wrong date
      - region or device segment disappears
    verification_fields:
      - users.user_id
      - users.register_time
      - users.region
      - users.device_type
    diagnostic_tools:
      - sql_query
      - check_null_rate
      - check_freshness
      - detect_distribution_drift

  - id: paid_users
    name: Paid Users
    description: Distinct users with a valid subscription lifecycle on the metric date.
    source_table: subscriptions
    time_column: start_time
    entity_column: user_id
    aggregation: count_distinct
    validity:
      start_column: start_time
      end_column: end_time
      end_operator: ">"
      null_end_means_valid: true
      status_column: subscription_status
      active_statuses:
        - active
        - cancelled
      end_required_statuses:
        - cancelled
    formula: >-
      COUNT(DISTINCT user_id) WHERE start_time <= metric_date
      AND subscription_status IN ('active', 'cancelled')
      AND (subscription_status != 'cancelled' OR end_time IS NOT NULL)
      AND (end_time IS NULL OR end_time > metric_date)
    query: >-
      SELECT dates.metric_date,
      COUNT(DISTINCT subscriptions.user_id) AS paid_users
      FROM metric_dates AS dates
      LEFT JOIN subscriptions
      ON CAST(subscriptions.start_time AS DATE) <= dates.metric_date
      AND subscriptions.subscription_status IN ('active', 'cancelled')
      AND (subscriptions.subscription_status != 'cancelled'
      OR subscriptions.end_time IS NOT NULL)
      AND (subscriptions.end_time IS NULL
      OR CAST(subscriptions.end_time AS DATE) > dates.metric_date)
      GROUP BY dates.metric_date
    unit: users
    validation:
      expected_column_types:
        metric_date: DATE
        paid_users: BIGINT
      numeric_ranges:
        paid_users:
          minimum: 0
      max_result_rows: 1000
    common_anomalies:
      - paid-user count drops despite active subscriptions
      - ended subscriptions remain counted
      - paid users exceed active users
    verification_fields:
      - subscriptions.user_id
      - subscriptions.start_time
      - subscriptions.end_time
      - subscriptions.subscription_status
    diagnostic_tools: [sql_query, check_null_rate]

  - id: ai_task_count
    name: AI Task Count
    description: Number of AI task execution events on the metric date.
    source_table: events
    time_column: event_time
    entity_column: event_id
    aggregation: count
    filters:
      event_name: run_ai_task
    formula: COUNT(event_id) WHERE event_name = 'run_ai_task'
    query: >-
      SELECT CAST(event_time AS DATE) AS metric_date,
      COUNT(event_id) AS ai_task_count
      FROM events
      WHERE event_name = 'run_ai_task'
      GROUP BY metric_date
    unit: events
    validation:
      expected_column_types:
        metric_date: DATE
        ai_task_count: BIGINT
      numeric_ranges:
        ai_task_count:
          minimum: 0
      max_result_rows: 1000
    common_anomalies:
      - task count spikes from duplicate ingestion or join multiplication
      - task count drops after event-name drift
      - task volume is inconsistent with raw events
    verification_fields:
      - events.event_id
      - events.event_name
      - events.event_time
      - experiment_assignments.user_id
    diagnostic_tools:
      - sql_query
      - check_duplicate_rate
      - detect_distribution_drift

  - id: average_session_duration
    name: Average Session Duration
    description: Average sum of event durations per user session on the metric date.
    source_table: events
    time_column: event_time
    group_by:
      - user_id
      - session_id
    aggregation: average_after_group_sum
    formula: AVG(SUM(duration_seconds) GROUP BY user_id, session_id)
    query: >-
      SELECT metric_date,
      AVG(session_duration) AS average_session_duration
      FROM (
      SELECT CAST(event_time AS DATE) AS metric_date,
      user_id, session_id, SUM(duration_seconds) AS session_duration
      FROM events
      GROUP BY metric_date, user_id, session_id
      ) AS sessions
      GROUP BY metric_date
    unit: seconds
    validation:
      expected_column_types:
        metric_date: DATE
        average_session_duration: DOUBLE
      numeric_ranges:
        average_session_duration:
          minimum: 0
      max_result_rows: 1000
    common_anomalies:
      - average duration is amplified by a unit conversion error
      - duration distribution develops extreme outliers
      - session duration falls outside the normal range
    verification_fields:
      - events.duration_seconds
      - events.session_id
      - events.user_id
      - events.event_time
    diagnostic_tools: [sql_query]

  - id: conversion_rate
    name: Paid User Conversion Rate
    description: Distinct users active and starting a paid subscription on the metric date, divided by daily active users.
    source_tables:
      - events
      - subscriptions
    dependencies:
      - daily_active_users
    aggregation: ratio
    numerator: distinct_active_users_starting_paid_subscription
    denominator: daily_active_users
    zero_denominator: 0
    formula: >-
      COUNT(DISTINCT subscriptions.user_id) FILTER (
      WHERE DATE(subscriptions.start_time) = metric_date
      AND subscriptions.user_id IN (
      SELECT user_id FROM events WHERE DATE(event_time) = metric_date))
      / COUNT(DISTINCT events.user_id)
    query: >-
      WITH active_users AS (
      SELECT DISTINCT CAST(event_time AS DATE) AS metric_date, user_id
      FROM events
      ), newly_paid_users AS (
      SELECT DISTINCT CAST(start_time AS DATE) AS metric_date, user_id
      FROM subscriptions
      )
      SELECT active_users.metric_date,
      COUNT(DISTINCT newly_paid_users.user_id)::DOUBLE
      / NULLIF(COUNT(DISTINCT active_users.user_id), 0) AS conversion_rate
      FROM active_users
      LEFT JOIN newly_paid_users
      ON newly_paid_users.metric_date = active_users.metric_date
      AND newly_paid_users.user_id = active_users.user_id
      GROUP BY active_users.metric_date
    unit: ratio
    validation:
      expected_column_types:
        metric_date: DATE
        conversion_rate: DOUBLE
      numeric_ranges:
        conversion_rate:
          minimum: 0
          maximum: 1
      max_result_rows: 1000
    common_anomalies:
      - conversion rate shifts after an experiment allocation change
      - numerator or denominator unexpectedly becomes zero
      - conversion rate moves independently of active-user volume
    verification_fields:
      - events.user_id
      - events.event_time
      - subscriptions.user_id
      - subscriptions.start_time
      - experiment_assignments.variant
    diagnostic_tools: [sql_query, detect_distribution_drift]
